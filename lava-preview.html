<!doctype html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Floor Escape - Qayadan Axan Lava Mühərriki (Demo & Sandbox)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #070a16;
            color: #dfe7ff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 1.4rem;
            margin: 0 0 6px 0;
            color: #ff8a28;
            text-shadow: 0 0 16px rgba(255, 115, 0, 0.4);
        }
        .header p {
            font-size: 0.85rem;
            margin: 0;
            color: #94a3b8;
        }
        canvas {
            width: min(940px, 96vw);
            height: min(580px, 72svh);
            min-height: 380px;
            display: block;
            border: 1px solid #26314a;
            border-radius: 18px;
            background: #080b18;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }
        button {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 9px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        button:hover {
            background: #0284c7;
            border-color: #38bdf8;
            color: #fff;
            transform: translateY(-1px);
        }
        button.active {
            background: #ea580c;
            border-color: #fb923c;
            color: #fff;
            box-shadow: 0 0 14px rgba(234, 88, 12, 0.4);
        }
        .back-btn {
            margin-top: 16px;
            text-decoration: none;
            color: #38bdf8;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🌋 Floor Escape • Qayadan Axan Lava və Şəlalə Sistemi</h1>
    <p>3-qat temperatur lifləri, soyuyan bazalt qabığı və qayadan süzülən maye fizika simulyasiyası</p>
</div>

<canvas id="game"></canvas>

<nav id="controls">
    <button id="btn-cascade-right" class="active" onclick="setMode('cascade', 1)"><i class="fa-solid fa-arrow-turn-down"></i> Pillələr — Sağa</button>
    <button id="btn-cascade-left" onclick="setMode('cascade', -1)"><i class="fa-solid fa-arrow-turn-up"></i> Pillələr — Sola</button>
    <button id="btn-cascade-both" onclick="setMode('cascade', 0)"><i class="fa-solid fa-arrows-split-up-and-left"></i> Hər İki Yana</button>
    <button id="btn-bg" onclick="setMode('bg')"><i class="fa-solid fa-volcano"></i> Canlı Vulkanik Fon</button>
    <button id="btn-platform" onclick="setMode('platform')"><i class="fa-solid fa-mountain"></i> Tək Qaya Şəlaləsi</button>
</nav>

<a href="game.html" class="back-btn"><i class="fa-solid fa-gamepad"></i> Oyuna Qayıt (Floor Escape Arena)</a>

<script src="js/engine/lava-waterfall.js?v=1.0"></script>
<script>
const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
let w = 920, h = 560, last = 0, time = 0;

let currentMode = 'cascade';
let cascadeDirection = 1;

function setMode(mode, dir = 1) {
    currentMode = mode;
    cascadeDirection = dir;
    document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
    if (mode === 'cascade' && dir === 1) document.querySelector('#btn-cascade-right').classList.add('active');
    else if (mode === 'cascade' && dir === -1) document.querySelector('#btn-cascade-left').classList.add('active');
    else if (mode === 'cascade' && dir === 0) document.querySelector('#btn-cascade-both').classList.add('active');
    else if (mode === 'bg') document.querySelector('#btn-bg').classList.add('active');
    else if (mode === 'platform') document.querySelector('#btn-platform').classList.add('active');
}

function resize() {
    const r = canvas.getBoundingClientRect();
    w = r.width;
    h = r.height;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * d);
    canvas.height = Math.round(h * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
}
new ResizeObserver(resize).observe(canvas);

// Rejim 1: Pilləli Kaskad (Cascade)
function renderCascade(c, t, width, height, direction) {
    c.save();
    c.fillStyle = '#080b14';
    c.fillRect(0, 0, width, height);

    const scale = Math.min(width / 920, height / 560);
    c.translate((width - 920 * scale) / 2, (height - 560 * scale) / 2);
    c.scale(scale, scale);

    const glow = c.createRadialGradient(460, 320, 20, 460, 320, 430);
    glow.addColorStop(0, '#32170e');
    glow.addColorStop(1, '#080b14');
    c.fillStyle = glow;
    c.fillRect(0, 0, 920, 560);

    c.strokeStyle = 'rgba(110,130,160,.08)';
    c.lineWidth = 1;
    for (let x = 0; x < 920; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 560); c.stroke(); }
    for (let y = 0; y < 560; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(920, y); c.stroke(); }

    if (direction === -1) {
        c.translate(920, 0);
        c.scale(-1, 1);
    }

    const split = (direction === 0);
    const levels = split ? [
        { x: 325, y: 160, w: 270, hit: [460], out: [325, 595] },
        { x: 250, y: 295, w: 420, hit: [325, 595], out: [250, 670] },
        { x: 175, y: 430, w: 570, hit: [250, 670], out: [175, 745] }
    ] : [
        { x: 280, y: 160, w: 280, hit: [400], out: [560] },
        { x: 400, y: 295, w: 285, hit: [560], out: [400] },
        { x: 305, y: 430, w: 270, hit: [400], out: [575] }
    ];

    const source = split ? 460 : 400;
    LavaEngine.drawPlatformWaterfall(c, t, source - 13, 46, 26, 114);
    LavaEngine.drawLavaSourceRock(c, source - 13, 46, 26, 2, t);

    for (let index = 0; index < levels.length; index++) {
        const p = levels[index];
        const nextY = index < levels.length - 1 ? levels[index + 1].y : 510;

        for (const edge of p.out) {
            LavaEngine.drawPlatformWaterfall(c, t + index * 0.8, edge - 11, p.y + 2, 22, nextY - p.y - 2);
            LavaEngine.drawSpillwayLip(c, edge - 11, 22, p.y + p.h);
        }

        LavaEngine.drawCascadeShelf(c, t + index * 0.4, p);
    }

    // 🌋 DİB LAVA CANAVARI VƏ MAQMA DƏNİZİ (Lava Monster at the bottom receiving all cascades)
    const monsterY = 510;
    c.save();
    // Qızmar Alov Dənizi
    const poolGrad = c.createLinearGradient(0, monsterY, 0, 560);
    poolGrad.addColorStop(0, '#f97316');
    poolGrad.addColorStop(0.25, '#c2410c');
    poolGrad.addColorStop(0.6, '#7c2d12');
    poolGrad.addColorStop(1, '#450a0a');
    c.fillStyle = poolGrad;
    c.fillRect(0, monsterY, 920, 560 - monsterY);

    // Dalğalı səth
    c.strokeStyle = '#fde047';
    c.lineWidth = 2.5;
    c.beginPath();
    for (let xx = 0; xx <= 920; xx += 6) {
        let yy = monsterY + Math.sin(xx * 0.04 - t * 3) * 3 + Math.sin(xx * 0.08 + t * 2) * 1.5;
        xx === 0 ? c.moveTo(xx, yy) : c.lineTo(xx, yy);
    }
    c.stroke();

    // 👹 LAVA CANAVARI GÖVDƏSİ VƏ GÖZLƏRİ (Dənizdən çıxan obsidian canavar)
    const monsX = 460;
    const monsY = monsterY + 12;
    // Obsidian Başı
    c.fillStyle = '#0f172a';
    c.strokeStyle = '#dc2626';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(monsX - 60, monsY + 30);
    c.lineTo(monsX - 45, monsY - 10);
    c.lineTo(monsX - 25, monsY - 30); // Sol Buynuz
    c.lineTo(monsX - 15, monsY - 12);
    c.lineTo(monsX, monsY - 20);      // Baş təpəsi
    c.lineTo(monsX + 15, monsY - 12);
    c.lineTo(monsX + 25, monsY - 30); // Sağ Buynuz
    c.lineTo(monsX + 45, monsY - 10);
    c.lineTo(monsX + 60, monsY + 30);
    c.closePath();
    c.fill();
    c.stroke();

    // Qızmar Qırmızı Gözlər
    c.fillStyle = '#ef4444';
    c.shadowColor = '#ef4444';
    c.shadowBlur = 12;
    c.beginPath();
    c.ellipse(monsX - 22, monsY - 2, 7, 3, -0.2, 0, Math.PI * 2);
    c.ellipse(monsX + 22, monsY - 2, 7, 3, 0.2, 0, Math.PI * 2);
    c.fill();
    c.shadowBlur = 0;

    // Dişlər
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.moveTo(monsX - 20, monsY + 14); c.lineTo(monsX - 15, monsY + 22); c.lineTo(monsX - 10, monsY + 14);
    c.moveTo(monsX - 5, monsY + 14); c.lineTo(monsX, monsY + 23); c.lineTo(monsX + 5, monsY + 14);
    c.moveTo(monsX + 10, monsY + 14); c.lineTo(monsX + 15, monsY + 22); c.lineTo(monsX + 20, monsY + 14);
    c.fill();

    c.restore();
    c.restore();
}

// Rejim 2: Tək Qaya Şəlaləsi
function renderSinglePlatform(c, t, width, height) {
    c.save();
    c.fillStyle = '#080b18';
    c.fillRect(0, 0, width, height);

    const scale = Math.min(width / 920, height / 560);
    c.translate(width * 0.5, height * 0.52);
    c.scale(scale, scale);

    const platformX = -320;
    const platformY = -40;
    const platformW = 640;
    const platformH = 68;

    const lavaX = -45;
    const lavaY = -40;
    const lavaW = 90;
    const lavaH = 260;

    LavaEngine.drawPlatformWaterfall(c, t, lavaX, lavaY + platformH - 4, lavaW, lavaH);
    LavaEngine.drawRockPlatform(c, platformX, platformY, platformW, platformH, t);
    LavaEngine.drawLavaSourceRock(c, lavaX, lavaY + platformH - 4, lavaW, 1, t);
    LavaEngine.drawLavaImpactPool(c, t, lavaX + lavaW * 0.5, lavaY + platformH + lavaH, lavaW * 0.6);

    c.restore();
}

// Rejim 3: Canlı Vulkanik Fon (Background Grid)
function renderBackground(c, t, width, height) {
    c.save();
    c.scale(width / 920, height / 560);

    let bg = c.createLinearGradient(0, 0, 0, 560);
    bg.addColorStop(0, '#070a13');
    bg.addColorStop(0.65, '#21100f');
    bg.addColorStop(1, '#641805');
    c.fillStyle = bg;
    c.fillRect(0, 0, 920, 560);

    // Bazalt sütunlar
    for (let i = 0; i < 24; i++) {
        let x = i * 43 - 20, top = -40 + Math.sin(i * 7) * 65;
        c.beginPath(); c.moveTo(x, top); c.lineTo(x + 35, top - 12); c.lineTo(x + 51, 400 + Math.sin(i * 3) * 100); c.lineTo(x + 12, 535); c.lineTo(x - 8, 330); c.closePath();
        c.fillStyle = i % 2 ? '#131219' : '#0e1119'; c.fill(); c.strokeStyle = 'rgba(130,65,41,.16)'; c.lineWidth = 1; c.stroke();
    }

    const streams = [[-4, 96, 45, 416], [174, 143, 26, 369], [379, 83, 24, 429], [603, 119, 36, 393], [798, 183, 40, 329]];
    for (let i = 0; i < streams.length; i++) {
        const [x, y, ww, hh] = streams[i];
        c.save();
        c.globalAlpha = 0.7;
        LavaEngine.drawPlatformWaterfall(c, t * 0.7 + i * 2, x, y, ww, hh);
        c.restore();
        LavaEngine.drawLavaSourceRock(c, x, y, ww, i, t);
    }

    // Dib magma dənizi
    const pool = c.createLinearGradient(0, 500, 0, 560);
    pool.addColorStop(0, '#f25e0e');
    pool.addColorStop(0.24, '#902007');
    pool.addColorStop(1, '#250c09');
    c.beginPath();
    c.moveTo(0, 560);
    for (let x = 0; x <= 920; x += 8) c.lineTo(x, 510 + Math.sin(x * 0.025 + t) * 3);
    c.lineTo(920, 560);
    c.closePath();
    c.fillStyle = pool;
    c.fill();

    c.restore();
}

function frame(now) {
    const dt = Math.min((now - last) / 1000 || 0, 0.04);
    last = now;
    time += dt;

    if (currentMode === 'cascade') renderCascade(ctx, time, w, h, cascadeDirection);
    else if (currentMode === 'platform') renderSinglePlatform(ctx, time, w, h);
    else renderBackground(ctx, time, w, h);

    requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>

</body>
</html>
